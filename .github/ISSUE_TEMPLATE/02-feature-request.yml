name: Feature
description: |
  Ask for a new skill, prompt factory, reference pack, or host integration that
  does not exist today. Stay in the Agent Skills / AI-prompt lane.
title: "feature: "
labels:
  - enhancement
  - new
body:
  - type: markdown
    attributes:
      value: |
        SigmaSkills is for portable Agent Skills, prompts, contracts, and related
        templates — not product apps (no photo editors, dashboards, runtimes).
        Describe the capability and why it matters. Implementation ideas stay optional.

  - type: textarea
    id: capability
    attributes:
      label: What should people be able to do?
      description: One or two sentences. Observable skill or prompt outcome, not a library name.
      placeholder: Invoke a skill that turns an open API changelog into a migration brief for coding agents.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does that solve?
      description: The real pain or need — not only your preferred solution.
      placeholder: I currently paste changelogs into chat and rewrite the same “do this / don’t do that” brief by hand.
    validations:
      required: true

  - type: textarea
    id: done-looks-like
    attributes:
      label: What does done look like?
      description: Tick-box list of observable results that mean this is finished.
      placeholder: |
        - [ ] New top-level skill folder with SKILL.md (and references if needed)
        - [ ] README lists install + run for the skill
        - [ ] Output contract is explicit (chat-only vs report PR, etc.)
        - [ ] “Do not use for …” negatives are clear
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How urgent is this for you?
      options:
        - Now
        - Soon
        - Whenever
        - Backlog
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of addition? (optional)
      options:
        - New skill package
        - New prompt / brief template
        - New reference or contract doc
        - Host metadata (e.g. agents/openai.yaml)
        - Install / discoverability
        - Other (still skill/prompt related)

  - type: textarea
    id: cope-today
    attributes:
      label: How do you cope today? (optional)
      placeholder: I hand-write briefs in chat or reuse an old SigmaBrief output and edit it.

  - type: textarea
    id: example
    attributes:
      label: One real example (optional)
      description: A short story with a person, an action, and a result.
      placeholder: After a library release I run the skill on the changelog URL and paste the brief into three parallel agents.

  - type: textarea
    id: alternatives
    attributes:
      label: Other ideas you considered (optional)
      placeholder: Stretch SigmaBrief; a one-off Cursor rule; a gist I copy each time.

  - type: textarea
    id: leave-out
    attributes:
      label: Leave out (optional)
      description: What this issue should deliberately not include.
      placeholder: Building a web app, shipping runtime code for a product, or auditing whole unrelated repos.

  - type: textarea
    id: possible-approach
    attributes:
      label: Possible approach (optional)
      description: A guess at how to ship it — not a requirement.
      placeholder: Mirror sigmabrief’s folder layout; keep output chat-only; document npx skills add --skill …

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else? (optional)
      description: Sketch prompts, related issues, host constraints (Codex / Pi / Cursor).

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched for an existing request covering this problem.
          required: true
        - label: This stays in Agent Skills / prompts / templates (not an unrelated product app).
          required: true
        - label: I explained the underlying problem, not only a preferred solution.
          required: true
