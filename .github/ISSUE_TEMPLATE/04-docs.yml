name: Docs
description: |
  Fix or write README, skill install/run notes, or reference docs. The skill can
  be fine; the writing is wrong or missing.
title: "docs: "
labels:
  - documentation
  - new
body:
  - type: markdown
    attributes:
      value: |
        Use this when the fix lives in Markdown — README, SKILL.md prose,
        references/*.md, or install/run examples for Codex / Pi / Cursor.

  - type: textarea
    id: what-docs
    attributes:
      label: What needs writing or fixing?
      description: One or two sentences.
      placeholder: README still omits SigmaBrief’s “user-triggered only” note in the Run section.
    validations:
      required: true

  - type: textarea
    id: who-why
    attributes:
      label: Who is it for, and why does it matter?
      description: Someone installing or invoking a skill cold.
      placeholder: A Cursor user will treat SigmaBrief as ambient and get noisy briefs on ordinary chat.
    validations:
      required: true

  - type: textarea
    id: done-looks-like
    attributes:
      label: What does done look like?
      description: Tick-box list of observable results that mean this is finished.
      placeholder: |
        - [ ] README Run section states SigmaBrief is user-triggered only
        - [ ] Install snippets still match npx skills add / Codex / manual copy
        - [ ] A cold reader can install and invoke without guessing
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How urgent is this for you?
      options:
        - Now
        - Soon
        - Whenever
        - Backlog
    validations:
      required: true

  - type: textarea
    id: gap-today
    attributes:
      label: What is wrong or missing today? (optional)
      placeholder: Install block lists three skills but Run examples for one host are incomplete.

  - type: textarea
    id: pages
    attributes:
      label: Which pages or sections? (optional)
      placeholder: README.md Install + Run; sigmabrief/SKILL.md; references/prompt-contract.md

  - type: textarea
    id: leave-out
    attributes:
      label: Leave out (optional)
      placeholder: Rewriting every reference doc or changing skill behaviour.

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else? (optional)

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched for an existing docs issue covering this.
          required: true
        - label: This is documentation work (not a skill-logic bug or a new skill request).
          required: true
