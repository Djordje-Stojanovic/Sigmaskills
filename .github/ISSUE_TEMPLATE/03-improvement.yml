name: Improvement
description: |
  Make an existing skill, contract, or install path better: clearer, tighter,
  less fragile. Not a brand-new skill and not docs-only.
title: "improve: "
labels:
  - improvement
  - new
body:
  - type: markdown
    attributes:
      value: |
        Use this for tightening SKILL.md contracts, reference quality, host
        metadata, or install/run ergonomics of something that already ships.
        Skip optional fields for small chores.

  - type: textarea
    id: changing
    attributes:
      label: What are you changing?
      description: One or two sentences about the change itself.
      placeholder: Tighten SigmaReview’s “single findings file + report-only PR” wording so agents stop proposing multi-file dumps.
    validations:
      required: true

  - type: textarea
    id: why-now
    attributes:
      label: Why now?
      description: Why this matters today instead of “someday”.
      placeholder: Agents keep splitting findings across files even though the skill forbids it.
    validations:
      required: true

  - type: textarea
    id: done-looks-like
    attributes:
      label: What does done look like?
      description: Tick-box list of observable results that mean this is finished.
      placeholder: |
        - [ ] SKILL.md / report-contract state the single-file rule in one place agents cannot miss
        - [ ] Negatives call out multi-file and runtime-code edits
        - [ ] Existing skill purpose and publish flow stay the same
    validations:
      required: true

  - type: dropdown
    id: skill
    attributes:
      label: Which skill?
      options:
        - sigmareview
        - sigmaperformance
        - sigmabrief
        - Shared (README / install / repo-wide)
        - Other / not sure
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How urgent is this for you?
      options:
        - Now
        - Soon
        - Whenever
        - Backlog
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How it works today (optional)
      placeholder: Contract is correct but buried; agents skim past it.

  - type: textarea
    id: after
    attributes:
      label: How it should work after (optional)
      placeholder: Same skill behaviour, harder to violate the output contract on a cold invoke.

  - type: textarea
    id: in-scope
    attributes:
      label: In scope (optional)
      placeholder: SKILL.md operating contract + references/report-contract.md wording.

  - type: textarea
    id: leave-out
    attributes:
      label: Leave out (optional)
      placeholder: Redesigning the whole skill, adding a new skill, or changing audit methodology.

  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
      description: Known constraints, relevant paths, or a suggested approach.
      placeholder: Keep folder name and npx --skill id stable; prefer editing linked references over bloating SKILL.md.

  - type: textarea
    id: verify
    attributes:
      label: How you will verify (optional)
      placeholder: Cold-invoke the skill on a small public repo and confirm the agent’s plan matches the contract.

  - type: textarea
    id: risks
    attributes:
      label: Risks (optional)
      description: Possible regressions or confusion for hosts that cache skills.
      placeholder: Users with an old local skill copy won’t see the fix until they reinstall.

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else? (optional)

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched for an existing issue covering this improvement.
          required: true
        - label: This improves something that already exists (not a brand-new skill, not docs-only).
          required: true
