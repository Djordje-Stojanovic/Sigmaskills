name: Bug
description: |
  Something that should work in a skill, prompt, contract, or install path is
  wrong. Use this when behaviour is incorrect, not when you want a new skill.
title: "bug: "
labels:
  - bug
  - new
body:
  - type: markdown
    attributes:
      value: |
        SigmaSkills ships Agent Skills (SKILL.md, references, install/run docs) —
        not an app. Fill the required fields so someone can reproduce the skill
        or docs failure without guessing. Skip optional fields for a quick note.

  - type: textarea
    id: what-broke
    attributes:
      label: What broke?
      description: One or two sentences. Pretend you forgot this repo exists.
      placeholder: SigmaBrief emits briefs that tell agents to open fix PRs against the target product repo, which violates its contract.
    validations:
      required: true

  - type: textarea
    id: who-feels-it
    attributes:
      label: Who feels it, and how bad is it?
      description: Which skill or host, how often, and how serious is it?
      placeholder: Anyone running $sigmabrief on an issue. Happens every time; briefs are usable but the stop-condition is wrong.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen
      description: Smallest reliable sequence that triggers the problem.
      placeholder: |
        1. Install sigmabrief from this repo
        2. Invoke $sigmabrief on a public GitHub issue
        3. Read the “do not” / stop section of the emitted brief
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      placeholder: Brief tells the agent to implement and open a product fix PR.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
      placeholder: Brief stays chat-only — research lightly, emit copy-pastable prompts, stop. No product fix PR.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Where it ran
      description: Agent host, OS, and how the skill was installed or invoked.
      placeholder: Cursor / Windows 11 / npx skills add … --skill sigmabrief
    validations:
      required: true

  - type: dropdown
    id: skill
    attributes:
      label: Which skill? (if known)
      description: Leave blank-feeling? Pick the closest, or Other / not sure.
      options:
        - sigmareview
        - sigmaperformance
        - sigmabrief
        - Shared (README / install / repo-wide)
        - Other / not sure
        - New skill (not shipped yet)
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How urgent is this for you?
      options:
        - Now
        - Soon
        - Whenever
        - Backlog
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit (optional)
      placeholder: main @ 8dcf2b4, or the skill folder you copied

  - type: dropdown
    id: frequency
    attributes:
      label: How often? (optional)
      options:
        - Always
        - Often
        - Sometimes
        - Once

  - type: textarea
    id: evidence
    attributes:
      label: Snippet, transcript excerpt, or link (optional)
      description: Paste a short wrong output, SKILL.md quote, or issue URL. Strip tokens and secrets first.
      render: markdown

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else? (optional)
      description: Workaround, last known good commit, related issues, or a guess at the cause.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched for an existing issue that already covers this.
          required: true
        - label: I removed secrets and sensitive data from this report.
          required: true
