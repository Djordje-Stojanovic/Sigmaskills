name: Release

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Approved source commit SHA
        required: true
        type: string
      expected_version:
        description: Approved Release version
        required: true
        type: string
      expected_digest:
        description: Approved tarball SHA-256 digest
        required: true
        type: string

permissions: {}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected_commit }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Rebuild and verify the approved commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_DIGEST: ${{ inputs.expected_digest }}
        run: node ./src/release-ci.js validate

  publish:
    name: Publish
    needs: validate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.expected_commit }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with trusted-publishing support
        run: npm install -g npm@11.5.1
      - name: Publish matching GitHub and npm identities
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_DIGEST: ${{ inputs.expected_digest }}
        run: node ./src/release-ci.js publish
