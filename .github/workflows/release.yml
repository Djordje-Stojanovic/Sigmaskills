name: Release

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Approved source commit SHA
        required: true
        type: string
      expected_version:
        description: Approved Release version
        required: true
        type: string
      expected_digest:
        description: Approved tarball SHA-256 digest
        required: true
        type: string

permissions: {}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_commit }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24' # latest Node 24 LTS; its bundled npm supports trusted publishing (needs npm >= 11.5.1)
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Rebuild and verify the approved commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_DIGEST: ${{ inputs.expected_digest }}
        run: node ./scripts/release-ci.js validate

  publish:
    name: Publish
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_commit }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24' # latest Node 24 LTS; its bundled npm supports trusted publishing (needs npm >= 11.5.1)
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish matching GitHub and npm identities
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_DIGEST: ${{ inputs.expected_digest }}
        run: node ./scripts/release-ci.js publish
