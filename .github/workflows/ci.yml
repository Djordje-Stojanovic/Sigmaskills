name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Repo invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run structural tests
        run: npm test
