name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24]
        include:
          # package.json still allows Node 20 (engines >=20), so one job keeps it honest.
          - os: ubuntu-latest
            node-version: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # baseline tests rebuild hashes from Release tags
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Isolate the test filesystem
        shell: bash
        run: mkdir -p "${RUNNER_TEMP}/sigma-test-fs"
      - name: Run structural and installer tests
        env:
          TMPDIR: ${{ runner.temp }}/sigma-test-fs
          TMP: ${{ runner.temp }}/sigma-test-fs
          TEMP: ${{ runner.temp }}/sigma-test-fs
        run: npm test

  release-rehearsal:
    name: Release rehearsal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # identities read the last Release tag
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0' # same Node as release.yml
      - name: Preview, dispatch, validate, and publish with real npm pack and stubbed network
        run: node ./scripts/release-rehearsal.js
