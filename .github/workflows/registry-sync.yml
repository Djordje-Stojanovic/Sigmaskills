name: Registry sync

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact default-branch SHA whose converter must run
        required: true
        type: string
      upstream_revision:
        description: Pinned 40-hex upstream revision
        required: true
        type: string

permissions: {}

concurrency:
  group: registry-sync
  cancel-in-progress: false

jobs:
  generate:
    name: Generate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_head || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Generate allowlisted registry pull request
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head || github.sha }}
          UPSTREAM_REVISION: ${{ inputs.upstream_revision }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ./scripts/registry/automation-ci.js generate

  auto-merge:
    name: Auto-merge safe registry patch
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_head || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Merge and publish a safe registry patch Release
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head || github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_WORKFLOW_FILE: registry-sync.yml
        run: node ./scripts/registry/automation-ci.js auto-merge
