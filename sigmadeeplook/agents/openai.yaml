interface:
  display_name: SigmaDeepLook
  short_description: Look inside a file too big to read, binary or media
  default_prompt: Use $sigmadeeplook when a file is too big to read, binary or media.
    Run its gate first; read about 1,000 tokens, then continue with --more or drill
    down only if you need more, and report what it shows and what it could not look at.
policy:
  products:
  - chatgpt
  - codex
  - atlas
  allow_implicit_invocation: true
